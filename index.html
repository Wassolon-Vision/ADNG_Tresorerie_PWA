<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADNG Trésorerie</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1b5e20"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ADNG Trésorerie">
<style>
:root{--g:#1b5e20;--bg:#f4f7f4;--c:#fff;--t:#1a1a1a;--m:#666;--b:#d5ddd5;--r:#b71c1c;--ok:#e8f5e9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#6fbf73;--bg:#121512;--c:#1c211c;--t:#eaeeea;--m:#9aa59a;--b:#333b33;--r:#ef7b7b;--ok:#1f2f20}}
:root[data-theme="dark"]{--g:#6fbf73;--bg:#121512;--c:#1c211c;--t:#eaeeea;--m:#9aa59a;--b:#333b33;--r:#ef7b7b;--ok:#1f2f20}
html,body{margin:0;background:var(--bg);color:var(--t);font:15px Arial,sans-serif}
header{background:var(--g);color:#fff;padding:10px 12px;font-weight:bold}
header small{display:block;font-weight:normal;opacity:.85}
nav{display:flex;overflow-x:auto;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:0}
nav button{flex:0 0 auto;border:0;background:none;color:var(--m);padding:11px 13px;font-size:14px}
nav button.on{color:var(--g);border-bottom:3px solid var(--g);font-weight:bold}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:12px}
.k{display:grid;grid-template-columns:1fr 1fr;gap:8px}.k div{background:var(--ok);border-radius:8px;padding:8px}
.k b{display:block;font-size:17px;color:var(--g)}.k span{font-size:12px;color:var(--m)}
label{display:block;font-size:13px;color:var(--m);margin:8px 0 3px}
input,select{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t)}
.btn{display:block;width:100%;padding:12px;margin-top:10px;border:0;border-radius:8px;background:var(--g);color:#fff;font-size:16px;font-weight:bold}
.btn.s{background:var(--c);color:var(--g);border:1px solid var(--g)}.btn.d{background:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 4px;border-bottom:1px solid var(--b);text-align:right}
th:first-child,td:first-child{text-align:left}th{color:var(--m);font-weight:normal}
.w{overflow-x:auto}.bad{color:var(--r);font-weight:bold}.good{color:var(--g);font-weight:bold}h3{margin:4px 0 8px;color:var(--g)}
.note{font-size:12px;color:var(--m)}
.card{background:color-mix(in srgb,var(--c) 90%,transparent)}
header{display:flex;align-items:center;gap:10px}header img{width:44px;height:44px;border-radius:50%;background:#fff;object-fit:cover}
#wm{position:fixed;inset:0;background:center 55%/min(75vw,440px) no-repeat;opacity:.07;mix-blend-mode:multiply;pointer-events:none;z-index:0}
:root[data-theme="dark"] #wm{mix-blend-mode:screen;filter:invert(1)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #wm{mix-blend-mode:screen;filter:invert(1)}}
main{position:relative;z-index:1}
@media print{header,nav,.np,button,#wm{display:none!important}body{background:#fff}.card{border:0}}
</style></head><body>
<div id="wm"></div><header><img id="lg" alt="Logo ADNG"><div>Ançar Dine National de Guinée<small id="sub"></small></div></header>
<nav id="nav"></nav><main id="m"></main>

const fmt=n=>Math.round(n||0).toLocaleString('fr-FR'),$=s=>document.querySelector(s);
const mat=i=>'ADNG-'+st.S[i][0]+'-'+String(i+1).padStart(2,'0'),rid=v=>'REC-'+String(v.id).padStart(4,'0');
const fd=d=>d.split('-').reverse().join('/'),today=()=>new Date().toISOString().slice(0,10);
const tot=()=>st.Q.reduce((a,q)=>a+q[1],0),eff=()=>st.S.reduce((a,s)=>a+s[2],0);
const split=g=>{const T=tot(),n=st.Q.length;let r=st.Q.map(q=>Math.round(g*q[1]/T));r[n-1]=g-r.slice(0,n-1).reduce((a,b)=>a+b,0);return r};
function agg(){const a={q:st.Q.map(()=>0),x:st.N.map(()=>0),s:st.S.map(()=>({g:0,x:0,n:0,m:Array(12).fill(0)}))};
st.V.filter(v=>!v.an).forEach(v=>{spl(v).forEach((k,j)=>a.q[j]+=k);v.x.forEach((k,j)=>a.x[j]+=k);const s=a.s[v.si];s.g+=v.g;s.x+=xs(v);s.n++;s.m[MOIS.indexOf(v.mo)]+=v.g});return a}
const dep=()=>st.D.filter(d=>!d.an).reduce((a,d)=>a+d.m,0);
const rubr=()=>st.Q.map(q=>q[0]).concat(st.N);
